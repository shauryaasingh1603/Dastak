<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="दस्तक – ज़फ़राबाद दावा अभियान">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b4441f">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="दस्तक">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>दस्तक</title>
  <link rel="manifest" href="manifest.json">
  <!-- tool/make_sw.dart replaces this line with preloads of the fonts, so
       they download alongside the app instead of after it. -->
  <meta name="dastak-preload">

  <style>
    html, body { margin: 0; height: 100%; background: #f6f3ee; }
    #dastak-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: "Noto Sans Devanagari", sans-serif; color: #3a3632;
      text-align: center; padding: 24px; box-sizing: border-box;
      transition: opacity .25s;
    }
    #dastak-splash h1 { margin: 0; font-size: 44px; color: #b4441f; }
    #dastak-splash .bar {
      width: 180px; height: 6px; border-radius: 3px; background: #e6ded3; overflow: hidden;
    }
    #dastak-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #b4441f; animation: dastak-slide 1.2s ease-in-out infinite;
    }
    @keyframes dastak-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #dastak-splash p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 300px; }
    #dastak-slow { visibility: hidden; color: #6b645c; }
  </style>
</head>
<body>
  <!-- Shown until the app draws its first screen. -->
  <div id="dastak-splash" role="status">
    <h1>दस्तक</h1>
    <div class="bar"></div>
    <p>खुल रहा है…</p>
    <p id="dastak-slow">पहली बार खुलने में थोड़ा समय लगता है। इसके बाद यह जल्दी और बिना नेटवर्क के भी खुलेगा।</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Update notice, shown over the app when a new version is ready. -->
  <div id="dastak-update" role="status" style="display:none;position:fixed;left:12px;right:12px;bottom:88px;z-index:9999;
       background:#1d1c1a;color:#fff;border-radius:12px;padding:12px 14px;font:16px/1.4 sans-serif;
       box-shadow:0 4px 16px rgba(0,0,0,.3);align-items:center;gap:12px">
    <span style="flex:1">नया संस्करण उपलब्ध है</span>
    <button id="dastak-update-go" style="background:#b4441f;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 16px sans-serif">खोलें</button>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('dastak-splash');
      var slow = setTimeout(function () {
        document.getElementById('dastak-slow').style.visibility = 'visible';
      }, 6000);

      // The offline helper (sw.js) keeps the app on the phone. It starts only
      // once the app is on screen, so the first visit does not download
      // everything twice at the same time.
      var registered = false;
      function registerOffline() {
        if (registered || !('serviceWorker' in navigator)) return;
        registered = true;
        // Ask the browser not to clear stored data, where unsent visits wait.
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(function () {});
        }
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          var banner = document.getElementById('dastak-update');
          var updating = false;
          function offer(worker) {
            banner.style.display = 'flex';
            document.getElementById('dastak-update-go').onclick = function () {
              updating = true;
              worker.postMessage('SKIP_WAITING');
            };
          }
          if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
            });
          });
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (updating) location.reload();
          });
          // Look for a new version every 30 minutes while the app is open.
          setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
        }).catch(function () {});
      }

      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 300);
        registerOffline();
      });
      // If the app never draws (an error), still keep it for next time.
      setTimeout(registerOffline, 60000);
    })();
  </script>
</body>
</html>
